<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notlarım Sitesi</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    body { font-family: 'Inter', sans-serif; }
    .note { transition: all 0.3s ease-in-out; }
</style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100">

<!-- Giriş Sayfası -->
<div id="login-page" class="fixed inset-0 z-50 flex flex-col items-center justify-center min-h-screen bg-gray-100 dark:bg-gray-900">
    <div id="login-form" class="bg-white dark:bg-gray-800 p-8 rounded-lg shadow-lg w-full max-w-sm">
        <h2 class="text-2xl font-bold mb-6 text-center text-blue-600 dark:text-blue-400">Giriş Yap</h2>
        <input id="username" type="text" placeholder="Kullanıcı Adı" class="w-full mb-4 p-3 rounded border border-gray-300 dark:bg-gray-700 dark:border-gray-600 focus:outline-none">
        <input id="password" type="password" placeholder="Şifre" class="w-full mb-6 p-3 rounded border border-gray-300 dark:bg-gray-700 dark:border-gray-600 focus:outline-none">
        <button id="login-btn" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-md hover:bg-blue-700 transition-colors duration-300">Giriş Yap</button>
        <button id="show-register-btn" class="w-full mt-2 bg-green-300 text-grenn-300 font-bold py-2 px-4 rounded-md hover:bg-gray-400 transition-colors duration-300">Kayıt Ol</button>
        <p id="login-error" class="text-red-500 mt-4 text-center hidden">Kullanıcı adı veya Şifre hatalı!</p>
    </div>
    <div id="register-page" class="bg-white dark:bg-gray-800 p-8 rounded-lg shadow-lg w-full max-w-sm hidden">
        <h2 class="text-2xl font-bold mb-6 text-center text-green-600 dark:text-green-400">Kayıt Ol</h2>
        <input id="register-username" type="text" placeholder="Kullanıcı Adı" class="w-full mb-4 p-3 rounded border border-gray-300 dark:bg-gray-700 dark:border-gray-600 focus:outline-none">
        <input id="register-password" type="password" placeholder="Şifre" class="w-full mb-6 p-3 rounded border border-gray-300 dark:bg-gray-700 dark:border-gray-600 focus:outline-none">
        <button id="register-btn" class="w-full bg-green-600 text-white font-bold py-3 px-4 rounded-md hover:bg-green-700 transition-colors duration-300">Kayıt Ol</button>
        <button id="show-login-btn" class="w-full mt-2 bg-gray-300 text-gray-700 font-bold py-2 px-4 rounded-md hover:bg-gray-400 transition-colors duration-300">Girişe Dön</button>
        <p id="register-error" class="text-red-500 mt-4 text-center hidden">Kullanıcı adı zaten var!</p>
        <p id="register-success" class="text-green-500 mt-4 text-center hidden">Kayıt başarılı! Giriş yapabilirsiniz.</p>
    </div>
</div>
<!-- Giriş Formunun Altına Ekle -->
<button id="show-register-btn" class="w-full mt-2 bg-gray-300 text-gray-700 font-bold py-2 px-4 rounded-md hover:bg-gray-400 transition-colors duration-300">Kayıt Ol</button>
<!-- Kayıt Formu -->
<div id="register-page" class="hidden">
    <h2 class="text-2xl font-bold mb-6 text-center text-green-600 dark:text-green-400">Kayıt Ol</h2>
    <input id="register-username" type="text" placeholder="Kullanıcı Adı" class="w-full mb-4 p-3 rounded border border-gray-300 dark:bg-gray-700 dark:border-gray-600 focus:outline-none">
    <input id="register-password" type="password" placeholder="Şifre" class="w-full mb-6 p-3 rounded border border-gray-300 dark:bg-gray-700 dark:border-gray-600 focus:outline-none">
    <button id="register-btn" class="w-full bg-green-600 text-white font-bold py-3 px-4 rounded-md hover:bg-green-700 transition-colors duration-300">Kayıt Ol</button>
    <button id="show-login-btn" class="w-full mt-2 bg-gray-300 text-gray-700 font-bold py-2 px-4 rounded-md hover:bg-gray-400 transition-colors duration-300">Girişe Dön</button>
    <p id="register-error" class="text-red-500 mt-4 text-center hidden">Kullanıcı adı zaten var!</p>
    <p id="register-success" class="text-green-500 mt-4 text-center hidden">Kayıt başarılı! Giriş yapabilirsiniz.</p>
</div>

<!-- Not uygulaması kapsayıcısı -->
<div id="app" style="display:none">
    <div class="container mx-auto p-4 md:p-8 max-w-4xl">
        <header class="text-center mb-8">
            <h1 class="text-4xl md:text-5xl font-bold text-blue-600 dark:text-blue-400">Not Uygulamam</h1>
            <p class="text-gray-600 dark:text-gray-400 mt-2">Kolayca notlarınızı oluşturun ve yönetin.</p>
        </header>

        <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-lg mb-8">
            <h2 class="text-2xl font-semibold mb-4">Not Yazabilirsin</h2>
            <div class="space-y-4">
                <textarea id="note-input" class="w-full p-3 bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none" rows="4" placeholder="Notunuzu buraya yazın..."></textarea>
                <button id="add-note-btn" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 dark:focus:ring-offset-gray-900 transition-colors duration-300">
                    Not Ekle
                </button>
            </div>
        </div>

        <div>
            <h2 class="text-2xl font-semibold mb-4">Notlarım</h2>
            <div id="notes-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            </div>
        </div>
    </div>
</div>

<script>
// Kayıt ve giriş formu geçişleri
const showRegisterBtn = document.getElementById('show-register-btn');
const registerPage = document.getElementById('register-page');
const showLoginBtn = document.getElementById('show-login-btn');
const registerBtn = document.getElementById('register-btn');
const registerError = document.getElementById('register-error');
const registerSuccess = document.getElementById('register-success');
const loginForm = document.getElementById('login-form');

showRegisterBtn.addEventListener('click', function() {
    loginForm.classList.add('hidden');
    registerPage.classList.remove('hidden');
});

showLoginBtn.addEventListener('click', function() {
    registerPage.classList.add('hidden');
    loginForm.classList.remove('hidden');
    registerError.classList.add('hidden');
    registerSuccess.classList.add('hidden');
});

// Kayıt işlemi
registerBtn.addEventListener('click', function() {
    const username = document.getElementById('register-username').value.trim();
    const password = document.getElementById('register-password').value.trim();
    if (!username || !password) return;

    let users = JSON.parse(localStorage.getItem('users') || '{}');
    if (users[username]) {
        registerError.classList.remove('hidden');
        registerSuccess.classList.add('hidden');
    } else {
        users[username] = password;
        localStorage.setItem('users', JSON.stringify(users));
        registerError.classList.add('hidden');
        registerSuccess.classList.remove('hidden');
    }
});
const loginPage = document.getElementById('login-page');
const app = document.getElementById('app');
const loginBtn = document.getElementById('login-btn');
const loginError = document.getElementById('login-error');

loginBtn.addEventListener('click', function() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();

    let users = JSON.parse(localStorage.getItem('users') || '{}');
    if(users[username] && users[username] === password) {
        loginPage.style.display = 'none';
        app.style.display = 'block';
        loadNotes();
    } else {
        loginError.classList.remove('hidden');
    }
});

const noteInput = document.getElementById('note-input');
const addNoteBtn = document.getElementById('add-note-btn');
const notesContainer = document.getElementById('notes-container');

addNoteBtn.addEventListener('click', addNote);
noteInput.addEventListener('keydown', function(e) {
    if(e.ctrlKey && e.key === 'Enter') addNote();
});

function escapeHTML(str) {
    const p = document.createElement('p');
    p.appendChild(document.createTextNode(str));
    return p.innerHTML;
}

function saveNotes() {
    const notes = [];
    document.querySelectorAll('#notes-container .note').forEach(note => {
        notes.push({
            text: note.querySelector('p').innerText,
            date: note.querySelector('span').innerText
        });
    });
    localStorage.setItem('notes', JSON.stringify(notes));
}

function renderNote(text, date) {
    const noteElement = document.createElement('div');
    noteElement.classList.add('note', 'bg-white', 'dark:bg-gray-800', 'p-4', 'rounded-lg', 'shadow-md', 'flex', 'flex-col', 'justify-between');
    noteElement.innerHTML = `
        <p class="text-gray-800 dark:text-gray-200 mb-4 whitespace-pre-wrap break-words">${escapeHTML(text)}</p>
        <div class="flex justify-between items-center text-sm text-gray-500 dark:text-gray-400">
            <span>${date}</span>
            <button class="delete-btn text-red-500 hover:text-red-700 font-semibold">Sil</button>
        </div>
    `;
    notesContainer.prepend(noteElement);

    const deleteBtn = noteElement.querySelector('.delete-btn');
    deleteBtn.addEventListener('click', () => {
        noteElement.remove();
        saveNotes();
    });
}

function addNote() {
    const noteText = noteInput.value.trim();
    if(noteText === '') return;

    const date = new Date().toLocaleDateString('tr-TR', { day:'2-digit', month:'2-digit', year:'numeric' });
    renderNote(noteText, date);
    saveNotes();
    noteInput.value = '';
    noteInput.focus();
}

function loadNotes() {
    const savedNotes = JSON.parse(localStorage.getItem('notes')) || [];
    savedNotes.sort((a,b) => {
        const [dayA, monthA, yearA] = a.date.split('.').map(Number);
        const [dayB, monthB, yearB] = b.date.split('.').map(Number);
        return new Date(yearB, monthB-1, dayB) - new Date(yearA, monthA-1, dayA);
    });
    savedNotes.forEach(note => renderNote(note.text, note.date));
}
</script>

</body>
</html>
